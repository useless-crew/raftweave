services:
  postgres:
    image: postgres:16-alpine
    container_name: raftweave-postgres
    environment:
      POSTGRES_DB: raftweave_auth
      POSTGRES_USER: raftweave
      POSTGRES_PASSWORD: raftweave_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raftweave -d raftweave_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - raftweave-internal

  redis:
    image: redis:7-alpine
    container_name: raftweave-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass raftweave_redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "raftweave_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - raftweave-internal

  # Lightweight database administration UI. Bound to 127.0.0.1 only —
  # never expose this on a non-loopback interface.
  adminer:
    image: adminer:4-standalone
    container_name: raftweave-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DESIGN: dracula
    networks:
      - raftweave-internal
    labels:
      com.raftweave.role: "dev-tooling"
      com.raftweave.access: "localhost-only"

  # Dev-mode Vault server for local secret storage (webhook HMAC secrets,
  # cloud credentials). Not for production use — dev mode is unsealed,
  # in-memory, and uses a fixed root token.
  vault:
    image: hashicorp/vault:1.18
    container_name: raftweave-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: raftweave_dev_root_token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - raftweave-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raftweave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://raftweave:raftweave_dev_password@postgres:5432/raftweave_auth?sslmode=disable
      REDIS_URL: redis://:raftweave_redis_password@redis:6379/0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raftweave-internal

volumes:
  postgres_data:

networks:
  raftweave-internal:
    driver: bridge
